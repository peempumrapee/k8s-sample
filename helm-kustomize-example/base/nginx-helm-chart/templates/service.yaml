apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx.service.name" . }}
  labels:
    app: {{ include "nginx.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app: {{ include "nginx.fullname" . }}
